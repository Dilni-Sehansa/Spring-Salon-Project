<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elegance · Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f4ede8;
            background-image: radial-gradient(ellipse at 20% 30%, rgba(210, 180, 160, 0.2) 0%, transparent 60%),
            radial-gradient(ellipse at 80% 70%, rgba(180, 140, 120, 0.12) 0%, transparent 50%),
            linear-gradient(145deg, #f8f2ed 0%, #e8dbd2 100%);
            position: relative;
        }

        /* Decorative glow */
        body::before {
            content: '';
            position: absolute;
            width: 40%;
            height: 40%;
            top: -5%;
            left: -5%;
            background: radial-gradient(circle, rgba(200, 170, 150, 0.15) 0%, transparent 70%);
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }

        .auth-card {
            position: relative;
            z-index: 1;
            max-width: 480px;
            width: 100%;
            background: rgba(255, 252, 249, 0.80);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 48px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.08), 0 12px 30px rgba(0, 0, 0, 0.03), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: floatUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card-inner {
            background: #ffffff;
            border-radius: 40px;
            padding: 44px 36px;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.02);
        }

        /* Brand */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .brand-header .brand-icon {
            font-size: 2rem;
            color: #b3886a;
            background: rgba(179, 136, 106, 0.10);
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
        }

        .brand-header h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 2.2rem;
            color: #2d2823;
            letter-spacing: -0.5px;
        }
        .brand-header h1 span {
            color: #b3886a;
        }

        .page-subtitle {
            text-align: center;
            color: #7f7168;
            font-size: 0.95rem;
            margin-bottom: 32px;
            font-weight: 400;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #4d4038;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: #f4eee9;
            border-radius: 14px;
            transition: all 0.25s ease;
            border: 1.5px solid transparent;
        }

        .input-wrapper:focus-within {
            background: #ffffff;
            border-color: #b3886a;
            box-shadow: 0 0 0 5px rgba(179, 136, 106, 0.12);
        }

        .input-wrapper .input-icon {
            padding-left: 16px;
            color: #b3886a;
            font-size: 0.95rem;
            opacity: 0.6;
        }
        .input-wrapper:focus-within .input-icon {
            opacity: 1;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            border: none;
            background: transparent;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: #2d2823;
            outline: none;
            font-weight: 500;
        }
        .input-wrapper input::placeholder {
            color: #b7a89c;
            font-weight: 400;
        }

        .toggle-password {
            background: transparent;
            border: none;
            color: #a39285;
            padding-right: 16px;
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.2s;
        }
        .toggle-password:hover {
            color: #2d2823;
        }

        .form-error {
            color: #d45a5a;
            font-size: 0.72rem;
            margin-top: 4px;
            min-height: 18px;
            font-weight: 500;
        }

        .auth-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 18px 0 26px 0;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #4d4038;
            cursor: pointer;
        }
        .checkbox-label input[type="checkbox"] {
            accent-color: #b3886a;
            width: 16px;
            height: 16px;
        }

        .forgot-link {
            font-size: 0.85rem;
            color: #b3886a;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }
        .forgot-link:hover {
            color: #8f6f59;
            text-decoration: underline;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #b3886a;
            color: #fff;
            box-shadow: 0 4px 14px rgba(179, 136, 106, 0.25);
            margin-top: 4px;
        }

        .btn:hover {
            background: #9f765b;
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(179, 136, 106, 0.30);
        }
        .btn:active {
            transform: scale(0.97);
        }

        .btn-loader i {
            font-size: 1.1rem;
        }

        .auth-error {
            background: #fdeded;
            color: #b33c3c;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin: 16px 0 0 0;
            display: none;
            align-items: center;
            gap: 10px;
            border-left: 4px solid #b33c3c;
        }
        .auth-error.show {
            display: flex;
        }

        .text-center {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: #5f534b;
        }
        .text-center a {
            color: #b3886a;
            font-weight: 600;
            text-decoration: none;
        }
        .text-center a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card-inner {
                padding: 28px 18px;
            }
            .auth-card {
                border-radius: 32px;
            }
            .brand-header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="card-inner">

        <div class="brand-header">
            <span class="brand-icon"><i class="fas fa-spa"></i></span>
            <h1>Elegance<span>.</span></h1>
        </div>
        <p class="page-subtitle">Welcome back to your sanctuary.</p>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="loginEmail">Email or Username</label>
                <div class="input-wrapper">
                    <span class="input-icon"><i class="fas fa-user"></i></span>
                    <input type="text" id="loginEmail" placeholder="admin@elegance.com" value="admin@elegance.com" />
                </div>
                <div class="form-error" id="loginEmailError"></div>
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon"><i class="fas fa-lock"></i></span>
                    <input type="password" id="loginPassword" placeholder="••••••••" value="password" />
                    <button type="button" class="toggle-password" data-target="loginPassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="form-error" id="loginPasswordError"></div>
            </div>

            <div class="auth-options">
                <label class="checkbox-label">
                    <input type="checkbox" id="rememberMe" checked /> Remember me
                </label>
                <a href="#" class="forgot-link">Forgot?</a>
            </div>

            <button type="submit" class="btn" id="loginBtn">
                <span class="btn-text">Sign In</span>
                <span class="btn-loader" style="display:none;"><i class="fas fa-spinner fa-spin"></i></span>
            </button>

            <div class="auth-error" id="loginError">
                <i class="fas fa-exclamation-circle"></i> <span id="loginErrorMsg">Invalid credentials</span>
            </div>

            <div class="text-center">
                New to Elegance? <a href="register.html">Create account</a>
            </div>
        </form>

    </div>
</div>

<script>

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Glow</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root {
            --rose: #EC4899;
            --rose-dark: #DB2777;
            --crimson: #F43F5E;
            --pastel: #FDF2F8;
            --white: #FFFFFF;
            --border: #F3F4F6;
            --border-strong: #E5E7EB;
            --muted: #4B5563;
            --faint: #9CA3AF;
            --ink: #111827;
            --shadow-sm: 0 1px 2px rgba(17, 24, 39, 0.04);
            --shadow-md: 0 8px 24px rgba(17, 24, 39, 0.06);
            --shadow-lg: 0 24px 60px rgba(219, 39, 119, 0.16);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--pastel);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            padding: 20px;
        }

        ::selection {
            background: var(--rose);
            color: #fff;
        }

        /* ── Card Container ── */
        .login-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 44px 42px 38px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-md);
            transition: box-shadow 0.25s ease;
        }

        .login-card:hover {
            box-shadow: var(--shadow-lg);
        }

        /* ── Brand ── */
        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 62px;
            height: 62px;
            background: linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%);
            border-radius: 18px;
            box-shadow: 0 10px 24px rgba(219, 39, 119, 0.28);
            margin-bottom: 12px;
        }

        .brand-icon i {
            font-size: 1.6rem;
            color: #fff;
        }

        .brand h1 {
            font-family: 'Fraunces', serif;
            font-size: 1.7rem;
            font-weight: 600;
            color: var(--ink);
            letter-spacing: -0.3px;
        }

        .brand h1 span {
            color: var(--rose);
        }

        .brand p {
            font-size: 0.82rem;
            color: var(--faint);
            margin-top: 2px;
            letter-spacing: 0.8px;
            font-weight: 500;
        }

        /* ── Form fields ── */
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 11px 16px;
            border-radius: 11px;
            border: 1.5px solid var(--border-strong);
            background: #fcfcfd;
            font-family: inherit;
            font-size: 0.88rem;
            color: var(--ink);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            box-sizing: border-box;
        }

        .input-group input:focus {
            border-color: var(--rose);
            background: #fff;
            box-shadow: 0 0 0 3.5px rgba(236, 72, 153, 0.12);
        }

        .input-group input::placeholder {
            color: var(--faint);
            font-weight: 300;
            font-size: 0.82rem;
        }

        /* ── Button ── */
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%);
            color: #fff;
            border: none;
            padding: 13px 20px;
            border-radius: 13px;
            font-weight: 600;
            font-size: 0.92rem;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 10px 24px rgba(219, 39, 119, 0.28);
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            margin-top: 4px;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 30px rgba(219, 39, 119, 0.34);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ── Toggle link ── */
        .toggle-text {
            text-align: center;
            font-size: 0.82rem;
            color: var(--muted);
            margin-top: 18px;
        }

        .toggle-link {
            color: var(--rose);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        .toggle-link:hover {
            color: var(--rose-dark);
            text-decoration: underline;
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: var(--ink);
            color: #fff;
            padding: 13px 24px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.86rem;
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.22);
            z-index: 2000;
            opacity: 0;
            transform: translateY(14px);
            transition: all 0.35s ease;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success {
            background: linear-gradient(135deg, #059669, #047857);
        }

        .toast.error {
            background: linear-gradient(135deg, var(--crimson), #E11D48);
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 22px 28px;
            }

            .brand h1 {
                font-size: 1.4rem;
            }

            .brand-icon {
                width: 52px;
                height: 52px;
            }

            .brand-icon i {
                font-size: 1.3rem;
            }

            .input-group input {
                padding: 10px 14px;
                font-size: 0.84rem;
            }

            .btn-primary {
                padding: 12px 16px;
                font-size: 0.86rem;
            }
        }

        @media (max-width: 360px) {
            .login-card {
                padding: 24px 16px 22px;
            }

            .brand h1 {
                font-size: 1.2rem;
            }

            .brand p {
                font-size: 0.7rem;
            }

            .input-group label {
                font-size: 0.7rem;
            }

            .input-group input {
                padding: 8px 12px;
                font-size: 0.8rem;
            }

            .btn-primary {
                padding: 10px 14px;
                font-size: 0.8rem;
            }

            .toggle-text {
                font-size: 0.74rem;
            }
        }
    </style>
</head>
<body>

<div class="login-card">
    <!-- Brand -->
    <div class="brand">
        <div class="brand-icon">
            <i class="fas fa-spa"></i>
        </div>
        <h1>Glow<span>.</span></h1>
        <p>BEAUTY SALON</p>
    </div>

    <!-- Login Form — IDs & structure EXACTLY as original -->
    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="input-group">
            <label for="userName">User Name</label>
            <input type="text" placeholder="Enter your user name" name="username" id="userName" required>
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" placeholder="Enter password" name="password" id="password" required>
        </div>
        <button class="btn-primary" type="submit">
            <i class="fas fa-arrow-right-to-bracket"></i> Sign In
        </button>
    </form>

    <div class="toggle-text">
        New to us? <a href="singIn.html" class="toggle-link">Create Account</a>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>

    function showToast(message, type = 'success') {
        const toast = $('#toast');
        toast.text(message).removeClass('success error').addClass(`${type} show`);
        setTimeout(() => {
            toast.removeClass('show');
        }, 3000);
    }

    function handleLogin(event) {
        if (event) event.preventDefault();

        let userName = $('#userName').val().trim();
        let password = $('#password').val().trim();

        if (userName === '' || password === '') {
            alert("Please enter both username and password");
            return;
        }

        const loginData = {
            "userName": userName,
            "password": password
        };

        $.ajax({
            url: "http://localhost:8080/v1/user/login",
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(loginData),
            success: function (response) {
                console.log("Response:", response);

                let resultData = response.data || response.body;

                if (resultData && resultData.token) {
                    localStorage.setItem("JWT", resultData.token);
                    localStorage.setItem("userId", resultData.userId);
                    localStorage.setItem("USER_ROLE", resultData.userRole || resultData.role || "ADMIN");

                    showToast("Login Successful!");
                    window.location.href = "dashboard.html";
                } else {
                    showToast("Login successful, but token structure mismatched!");
                }
            },
            error: function (xhr) {
                console.error("Login Error:", xhr.responseText);
                if (xhr.status === 403 || xhr.status === 401) {
                    showToast("Invalid Username or Password!");
                } else {
                    showToast("Login failed! Status: " + xhr.status);
                }
            }
        });
    }</script>
</body>
</html>

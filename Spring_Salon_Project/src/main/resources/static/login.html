<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Glow Beauty Salon</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #fff5f5 0%, #ffeef0 100%); height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        .petal { position: absolute; background: #ff6f91; opacity: 0.4; border-radius: 50% 0 50% 50%; animation: float 8s infinite ease-in-out; z-index: -1; }
        .petal:nth-child(1) { width: 30px; height: 30px; top: 10%; left: 5%; animation-delay: 0s; }
        .petal:nth-child(2) { width: 20px; height: 20px; top: 20%; right: 10%; animation-delay: 2s; background: #ffb6c1; }
        .petal:nth-child(3) { width: 40px; height: 40px; bottom: 20%; left: 10%; animation-delay: 4s; }
        @keyframes float { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-20px) rotate(45deg); } 100% { transform: translateY(0px) rotate(0deg); } }
        .container { background: #ffffff; width: 380px; padding: 50px 40px; border-radius: 40px; box-shadow: 0 20px 40px rgba(255, 105, 135, 0.15); text-align: center; position: relative; z-index: 10; }
        .brand-title { font-size: 26px; font-weight: 700; color: #2d2d2d; margin-bottom: 5px; }
        .brand-sub { font-size: 12px; color: #ff6f91; font-weight: 600; letter-spacing: 3px; margin-bottom: 35px; }
        .input-group { margin-bottom: 22px; text-align: left; }
        .input-group label { display: block; font-size: 14px; font-weight: 600; color: #444; margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 14px 20px; border: 2px solid #f5f0f0; border-radius: 50px; background: #fcf9f9; font-family: inherit; outline: none; transition: all 0.3s; box-sizing: border-box; font-size: 14px; }
        .input-group input:focus { border-color: #ff6f91; background: #fff; box-shadow: 0 0 0 4px rgba(255, 111, 145, 0.1); }
        .btn-pink { width: 100%; background: #ff6f91; color: white; padding: 16px; border: none; border-radius: 50px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(255, 111, 145, 0.3); margin-bottom: 15px; }
        .btn-pink:hover { background: #ff527b; transform: translateY(-3px); }
        .toggle-text { font-size: 14px; color: #888; margin-top: 10px; }
        .toggle-link { color: #ff6f91; font-weight: 600; cursor: pointer; text-decoration: none; }
        .toggle-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="petal"></div><div class="petal"></div><div class="petal"></div>
<div class="container">
    <div class="brand-title">🌸 Glow</div>
    <div class="brand-sub">BEAUTY SALON</div>
    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="input-group">
            <label for="userName">User Name</label>
            <input type="text" placeholder="Enter your user name" name="username" id="userName" required>
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" placeholder="Enter password" name="password" id="password" required>
        </div>
        <button class="btn-pink" type="submit">Sign In</button>
    </form>
    <div class="toggle-text">New to us? <a href="singIn.html" class="toggle-link">Create Account</a></div>
</div>

<script>
    function handleLogin(event) {
        if (event) event.preventDefault();

        let userName = $('#userName').val().trim();
        let password = $('#password').val().trim();

        if (userName === '' || password === '') {
            alert("Please enter both username and password");
            return;
        }

        const loginData = {
            "userName": userName,
            "password": password
        };

        $.ajax({
            url: "http://localhost:8080/v1/user/login",
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(loginData),
            success: function (response) {
                console.log("Response:", response);

                let resultData = response.data || response.body;

                if (resultData && resultData.token) {
                    localStorage.setItem("JWT", resultData.token);
                    localStorage.setItem("userId", resultData.userId);

                    alert("Login Successful!");
                    window.location.href = "user.html";
                } else {
                    alert("Login successful, but token structure mismatched!");
                }
            },
            error: function (xhr) {
                console.error("Login Error:", xhr.responseText);
                if (xhr.status === 403 || xhr.status === 401) {
                    alert("Invalid Username or Password!");
                } else {
                    alert("Login failed! Status: " + xhr.status);
                }
            }
        });
    }</script>
</body>
</html>
